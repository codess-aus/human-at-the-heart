site_name: Human at the Heart
site_description: Trustworthy AI — keeping humans at the heart of intelligent systems. A GitHub + Microsoft perspective.
site_url: https://codess-aus.github.io/human-at-the-heart/
site_author: Master Chief Sparkle

repo_url: https://github.com/codess-aus/human-at-the-heart
repo_name: codess-aus/human-at-the-heart
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Mona Sans
    code: JetBrains Mono
  icon:
    logo: material/heart-pulse
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codess-aus/human-at-the-heart
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Chapters:
    - chapters/index.md
    - 01 — Trustworthy AI: chapters/01-trustworthy-ai.md
    - 02 — AI Is in the Loop: chapters/02-ai-is-in-the-loop.md
    - 03 — Trust Is the Ultimate Feature: chapters/03-trust-is-the-ultimate-feature.md
    - 04 — What We'll Cover: chapters/04-what-well-cover.md
    - 05 — Part One — Human-in-the-Loop: chapters/05-part-one-human-in-the-loop.md
    - 06 — Models Suggest. Humans Decide.: chapters/06-models-suggest-humans-decide.md
    - 07 — Why Oversight Matters: chapters/07-why-oversight-matters.md
    - 08 — The Loop, in Practice: chapters/08-the-loop-in-practice.md
    - 09 — Copilot in Action: chapters/09-copilot-in-action.md
    - 10 — Part Two — Principles: chapters/10-part-two-principles.md
    - 11 — Three Non-Negotiables: chapters/11-three-non-negotiables.md
    - 12 — Explainability: chapters/12-explainability.md
    - 13 — Reliability: chapters/13-reliability.md
    - 14 — Inclusivity: chapters/14-inclusivity.md
    - 15 — Microsoft's Responsible AI Standard: chapters/15-responsible-ai-standard.md
    - 16 — Trust, Shipped as Product: chapters/16-trust-shipped-as-product.md
    - 17 — Part Three — Practices: chapters/17-part-three-practices.md
    - 18 — Governance Without Friction: chapters/18-governance-without-friction.md
    - 19 — Empathy in the Workflow: chapters/19-empathy-in-the-workflow.md
    - 20 — A Practical Checklist: chapters/20-a-practical-checklist.md
    - 21 — Measuring Trust: chapters/21-measuring-trust.md
    - 22 — The Developer's Role: chapters/22-the-developers-role.md
    - 23 — Build It In, Ship It on Purpose: chapters/23-build-it-in-ship-it-on-purpose.md
    - 24 — Thank You: chapters/24-thank-you.md
  - About: about.md

copyright: >
  Made with care for the humans in the loop.
